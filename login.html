<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Custom Theme</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo"> BotAnex Forge</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="lets_connect.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Login Section -->
    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo-center">
                <a href="home.html" class="login-logo"><img src="images/logo.jpg"  alt="logo" class="logoimg"></a>
            </div>
            <div class="login-form">
                <h2>Login to Your Account</h2>
                <p>Welcome back! Please enter your details to log in.</p>
                <form action="dashboard.html" method="POST">
                    <div class="input-group">
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>
                    <div class="options">
                        <label>
                            <input type="checkbox" name="remember" id="remember">
                            Remember Me
                        </label>
                        <a href="forgot_password.html" class="forgot-password">Forgot Password?</a>
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                </form>
                <p class="signup-link">
                    New here? <a href="signup.html">Create an Account</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 MyBrand. All Rights Reserved.</p>
            <ul class="footer-links">
                <li><a href="privacy.html">Privacy Policy</a></li>
                <li><a href="terms.html">Terms of Service</a></li>
            </ul>
        </div>
    </footer>
</body>
</html>
